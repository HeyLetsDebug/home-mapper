<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Where's My Stuff</title>
<meta name="theme-color" content="#F2EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Stuff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Where's My Stuff</h1>
  <button id="menu-btn" class="icon-btn" aria-label="Menu">⋮</button>
</header>

<div id="menu-dropdown" class="dropdown hidden">
  <button id="export-pdf-btn">Export PDF report</button>
  <button id="export-btn">Export backup</button>
  <button id="import-btn">Import / restore backup</button>
  <button id="install-btn" class="hidden">Install app</button>
</div>
<input id="import-input" type="file" accept="application/json" class="hidden">
<input id="subspot-input" type="file" accept="image/*" capture="environment" class="hidden">

<main id="gallery-view" class="view">
  <div class="search-bar">
    <input id="search-input" type="search" placeholder="Search what you're looking for…" autocomplete="off">
  </div>
  <div id="gallery-grid" class="gallery-grid"></div>
  <p id="empty-state" class="empty-state hidden">Nothing stored yet. Tap the + button, snap a photo of a shelf or drawer, and start pinning notes to it.</p>
</main>

<section id="spot-view" class="view hidden">
  <div class="spot-header">
    <div class="spot-toolbar">
      <button id="back-btn" class="icon-btn" aria-label="Back">←</button>
      <div class="spot-toolbar-title">Location details</div>
      <button id="save-spot-btn" class="btn primary spot-save">Saved</button>
      <button id="favorite-btn" class="icon-btn" aria-label="Favorite this spot">☆</button>
      <button id="subspot-btn" class="icon-btn" aria-label="Add sub-location">＋</button>
      <button id="delete-spot-btn" class="icon-btn danger" aria-label="Delete this spot">🗑</button>
    </div>
    <div class="spot-fields">
      <label class="field">
        <span>Spot name</span>
        <input id="spot-label-input" type="text" placeholder="e.g. Blue box, top shelf" maxlength="60" autocomplete="off">
      </label>
      <label class="field">
        <span>Location</span>
        <input id="parent-spot-input" type="text" list="location-suggestions" placeholder="Top-level location — e.g. Bedroom" maxlength="80" autocomplete="off">
        <datalist id="location-suggestions"></datalist>
      </label>
    </div>
  </div>
  <div id="image-wrap" class="image-wrap">
    <img id="spot-image" alt="Storage spot">
    <div id="pins-layer"></div>
  </div>
  <p id="spot-breadcrumb" class="breadcrumb"></p>
  <p class="hint">Tap anywhere on the photo to pin a note there.</p>
</section>

<div id="note-sheet" class="sheet hidden">
  <div class="sheet-content">
    <textarea id="note-text" placeholder="What's stored here?" rows="3" maxlength="200"></textarea>
    <div class="sheet-actions">
      <button id="note-delete" class="btn danger hidden">Delete</button>
      <button id="note-subspot" class="btn ghost hidden">Sub-location</button>
      <button id="note-cancel" class="btn ghost">Cancel</button>
      <button id="note-save" class="btn primary">Save</button>
    </div>
  </div>
</div>

<div id="pdf-report" class="hidden"></div>


<nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation">
  <button id="nav-home" class="active">⌂<span>All</span></button>
  <button id="nav-favorites">☆<span>Favorites</span></button>
  <button id="nav-install" class="hidden">＋<span>Install</span></button>
</nav>

<button id="add-btn" class="fab" aria-label="Add new spot">+</button>
<input id="camera-input" type="file" accept="image/*" capture="environment" class="hidden">

<script src="app.js" defer></script>
</body>
</html>
